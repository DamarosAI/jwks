  <style>
    *{box-sizing:border-box;}
    :root{
      --ink-cold:#10161d;
      --ink-steel:#2f6193;
      --ink-quiet:#3c4955;
      --ink-faint:#586674;
      --ink-dim:#7b8794;
      --steel:#2f6193;
      --accent:#2f6193;
      --state-pass:#2e9e6b;
      --state-review:#bf831f;
      --state-fail:#dc3a52;
    }
    html{scroll-behavior:auto;scroll-padding-top:62px;}
    body{margin:0;background:#f5f8fb;color:var(--ink-cold);font-family:var(--font-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:clip;}
    a{color:inherit;text-decoration:none;}
    .dm-card-lift{background:linear-gradient(180deg, rgba(255,255,255,0.96) 0%, rgba(250,252,254,0.88) 100%);border:1px solid rgba(31,45,61,0.09);box-shadow:0 1px 2px rgba(20,40,70,0.03);}
    .dm-card-lift.dm-card-accent{background:linear-gradient(180deg, rgba(234,242,248,0.72) 0%, rgba(255,255,255,0.92) 100%);border:1px solid rgba(47,97,147,0.14);}
    .dm-site{background:#f5f8fb;background-color:#f5f8fb;}
    .dm-site section{background:transparent !important;}
    .dm-site footer{background:#f5f8fb !important;}
    html,body{overflow-x:clip;max-width:100%;}
    img,svg{max-width:100%;height:auto;}
    .dm-site{--dm-ref:1920px;width:100%;}
    .dm-site section[data-screen-label="Why now"]{content-visibility:auto;contain-intrinsic-size:1px 640px;}
    @media (min-width:901px) and (max-width:1919px){
      .dm-site section[data-screen-label="Writing hero"] h1,
      .dm-site section[data-screen-label="Privacy hero"] h1{
        font-size:clamp(2.1rem,calc(3.8rem * 100vw / var(--dm-ref)),3.8rem) !important;
      }
      .dm-site section[data-screen-label="Why now"] [style*="grid-template-columns:repeat(auto-fit"]{
        gap:clamp(24px,calc(56px * 100vw / var(--dm-ref)),56px) !important;
      }
      .dm-site section{
        padding-left:clamp(16px,calc(40px * 100vw / var(--dm-ref)),40px) !important;
        padding-right:clamp(16px,calc(40px * 100vw / var(--dm-ref)),40px) !important;
      }
    }
    @keyframes dmDrift{0%,100%{transform:translate(-50%,-50%) rotate(0deg);}50%{transform:translate(-49%,-51%) rotate(2.5deg);}}
    @keyframes chevBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(5px);}}
    @media (max-width:900px){
      .dm-site section[data-screen-label="Why now"] [style*="grid-template-columns:repeat(auto-fit"]{
        grid-template-columns:1fr !important;
        gap:28px !important;
      }
    }
    @media (max-width:768px){
      .dm-site section[data-screen-label="About hero"]{padding-top:clamp(48px,10vw,88px) !important;padding-bottom:clamp(40px,8vw,72px) !important;}
      .dm-site section[data-screen-label="About hero"] p[style*="font-size:clamp(1.5rem"]{font-size:clamp(1.2rem,5.2vw,1.85rem) !important;line-height:1.35 !important;}
    }
    @media (max-width:560px){
      .dm-site header{gap:8px !important;padding-left:14px !important;padding-right:14px !important;}
      .dm-site header nav{gap:2px !important;}
      .dm-site header nav a:not([href^="mailto"]){padding:10px 12px !important;font-size:13px !important;min-height:44px;display:inline-flex;align-items:center;}
      .dm-site header nav > div{margin:0 5px !important;}
      .dm-site header nav a[href^="mailto"]{height:44px !important;padding:0 15px !important;font-size:11px !important;}
      .dm-site .dm-goback{display:inline-flex !important;font-size:11px !important;letter-spacing:0.08em !important;gap:5px !important;min-height:44px;align-items:center;}
      .dm-site .dm-goback svg{width:14px;height:14px;}
      .dm-site header > a{gap:7px !important;min-width:0;}
      .dm-site footer{padding-left:16px !important;padding-right:16px !important;}
      .dm-site footer a{min-height:44px;display:inline-flex;align-items:center;padding:10px 12px;}
    }
    @media (max-width:400px){
      /* Keep secondary nav; only drop the divider like the home page */
      .dm-site header nav > div{display:none !important;}
      .dm-site header nav a:not([href^="mailto"]){display:inline-flex !important;}
    }
    @media (prefers-reduced-motion:reduce){
      [data-anim],.dm-hero-mark,[style*="animation:dmDrift"],[style*="animation:chevBounce"]{animation:none !important;}
      .dm-copy-email.dm-copied{animation:none !important;transform:none !important;}
    }
    @keyframes dmCopyPulse{
      0%{transform:scale(1);}
      35%{transform:scale(1.045);}
      100%{transform:scale(1);}
    }
    .dm-copy-email{
      position:relative;overflow:hidden;
      transition:transform 180ms ease, box-shadow 220ms ease, background 220ms ease, border-color 220ms ease;
    }
    .dm-copy-email .dm-copy-email-label{
      display:inline-block;
      transition:transform 220ms cubic-bezier(0.16,1,0.3,1), opacity 180ms ease;
    }
    .dm-copy-email .dm-copy-email-icon,
    .dm-copy-email .dm-copy-email-check{
      flex:none;display:block;
    }
    .dm-copy-email .dm-copy-email-check{display:none;}
    .dm-copy-email.dm-copied{
      background:linear-gradient(180deg,#3f8f6d,#2e9e6b) !important;
      border-color:color-mix(in srgb,#2e9e6b 55%,rgba(255,255,255,0.22)) !important;
      box-shadow:inset 0 1px 0 rgba(255,255,255,0.22), 0 8px 20px rgba(46,158,107,0.22) !important;
      animation:dmCopyPulse 480ms cubic-bezier(0.16,1,0.3,1);
    }
    .dm-copy-email.dm-copied .dm-copy-email-icon{display:none;}
    .dm-copy-email.dm-copied .dm-copy-email-check{display:block;}
    .dm-copy-email.dm-copied .dm-copy-email-label{
      transform:translateY(-1px);
    }
  </style>
