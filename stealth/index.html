    <style>
      /* STEALTH. One screen built from the site's parts: its ground and blue, its two faces, the drum. Under it
         a survey of ground nobody has named yet; over it, biomarkers falling in trails, and the pointer as
         the probe that ablates them. The name and a way in. */
      @font-face { font-family: 'Endless'; src: url('/assets/endless.ttf') format('truetype'); font-style: normal; font-weight: 400; font-display: swap; unicode-range: U+0020-007E; }
      @font-face { font-family: 'Switzer'; src: url('/assets/fonts/switzer-400.woff2') format('woff2'); font-style: normal; font-weight: 400; font-display: swap; }
      :root {
        color-scheme: light;
        --bg: #f8fafc;
        --page-ground: #e9eff5;
        --text: #10161d;
        --text-soft: #344351;
        --muted: #657482;
        --accent: #2f6193;
        --accent-strong: #214d79;
        --border: rgba(31, 45, 61, 0.13);
        --font-display: 'Endless', 'Switzer', sans-serif;
        --font-ui: 'Switzer', sans-serif;
        --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
      }
      * { box-sizing: border-box; }
      html { background: var(--page-ground); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      body { margin: 0; min-width: 320px; color: var(--text); font-family: var(--font-ui); font-kerning: none; font-variant-ligatures: none; font-feature-settings: 'kern' 0, 'liga' 0, 'calt' 0; font-synthesis: none; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      a { color: inherit; text-decoration: none; }
      a:hover { color: var(--accent-strong); }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 2px; }

      .scene {
        position: relative; min-height: 100vh; min-height: 100svh; overflow: hidden;
        display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 24px;
        background: radial-gradient(circle at 50% 46%, var(--bg) 0%, color-mix(in srgb, var(--bg) 60%, var(--page-ground)) 38%, var(--page-ground) 100%);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* THE SURVEY. Contours from stealth/make-topo.py, the summit exactly under the mark with clean rings around
         it. Every fourth line is an accent, a blue index contour at twice the weight; the others run blue,
         slate, blue. Ink faint enough to read as the paper. */
      /* The ground moves in script: a continuous drift plus the pointer's lean, one transform on this layer,
         turning about the summit, which placeTopo() pins under the mark and name. Oversized by 48px so no
         edge ever shows. */
      .topo-wrap { position: absolute; inset: -48px; overflow: hidden; pointer-events: none; will-change: transform; transform-origin: 50% 45.6%; }
      .topo { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 900ms ease; fill: none; stroke-linecap: round; stroke-linejoin: round; shape-rendering: geometricPrecision; }
      .topo-wrap.is-in .topo { opacity: 1; }
      .topo-ink { stroke: var(--text); stroke-opacity: 0.075; stroke-width: 0.8; }
      .topo-blue { stroke: var(--accent); stroke-opacity: 0.22; stroke-width: 0.8; }
      .topo-index { stroke: var(--accent); stroke-opacity: 0.3; stroke-width: 1.6; }
      .trails { position: absolute; inset: 0; pointer-events: none; will-change: transform; }

      .center { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; }
      /* THE MARK MOVES. Two motions on two wrappers, flat to the screen: a slow vertical float, and the site's own
         axis shimmy, a little wider here. Their periods share no factor, so the pair never quite repeats. */
      .float { will-change: transform; animation: drum-float 7.3s ease-in-out infinite alternate; }
      .drum { display: block; width: clamp(112px, 12vw, 160px); height: auto; overflow: visible; --drum-base: 0deg; transform-origin: 50% 50%; will-change: transform; animation: drum-axis-shimmy 12.7s ease-in-out infinite; }
      @keyframes drum-float { from { transform: translateY(7px); } to { transform: translateY(-7px); } }
      @keyframes drum-axis-shimmy { 0%, 100% { transform: rotate(calc(var(--drum-base) - 2.2deg)); } 50% { transform: rotate(calc(var(--drum-base) + 2.2deg)); } }
      .name { margin: 32px 0 0; font-family: var(--font-display); font-size: clamp(2rem, 3.4vw, 3rem); font-weight: 400; letter-spacing: -0.008em; line-height: 1; color: var(--text); }
      .contact { position: absolute; z-index: 2; left: 0; right: 0; bottom: 30px; margin: 0; text-align: center; pointer-events: none; }
      /* Plain underlined text, the email and Privacy alike. The email copies itself when clicked. */
      .link { pointer-events: auto; appearance: none; -webkit-appearance: none; margin: 0; padding: 6px 2px; border: 0; background: none; font: inherit; font-size: 0.82rem; color: var(--text-soft); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, currentColor 35%, transparent); cursor: pointer; transition: color 160ms ease, text-decoration-color 160ms ease; }
      .link:hover { color: var(--accent-strong); text-decoration-color: currentColor; }
      .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
      .copy { display: inline-block; text-align: center; }
      .sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

      @media (prefers-reduced-motion: reduce) { .float, .drum, .geo::before { animation: none; } }
      /* THE CORNERS. Bottom left, a geocache: the visitor's own approximate coordinates, decoded into place in
         the trails' mono face. Bottom right, a quiet tab to the privacy policy. Both sit on the email's line. */
      .geo, .privacy { position: absolute; z-index: 2; bottom: 30px; }
      .geo { left: 28px; display: flex; align-items: center; gap: 9px; margin: 0; padding: 6px 0; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; color: var(--text-soft); white-space: nowrap; opacity: 0; transition: opacity 600ms ease; }
      /* The pin: a small blue dot with a slow ping, so the coordinates read as a live fix, not a caption. */
      .geo::before { content: ''; flex: 0 0 auto; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); animation: geo-ping 2.8s ease-out infinite; }
      @keyframes geo-ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 70%, 100% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 0%, transparent); } }
      .geo.is-on { opacity: 1; }
      .geo-text { overflow: hidden; text-overflow: ellipsis; max-width: calc(100vw - 150px); }
      .privacy { right: 28px; }
      @media (max-width: 640px) {
        .contact { bottom: calc(env(safe-area-inset-bottom, 0px) + 58px); }
        .geo, .privacy { bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); }
        .geo { left: 20px; }
        .privacy { right: 20px; }
      }
    </style>

    <script>
/* THE TRAILS. Each trail is three or four markers from cancer care falling in one column, head first,
   the tail fading behind it. All one size, IBM Plex Mono, the house blue.

   THE PROBE. The pointer is the probe and the page is a quiet game:
   - in range, a marker LOCKS: its ink deepens and it trembles, so you see what you are about to take;
   - touched, it is ABLATED: the letters shear off and scatter, dust settles, a ring flashes at the site;
   - kills inside 0.7s CHAIN, and each link widens the ring;
   - a TALLY in the top-right corner appears with the first kill and counts from there, with the chain
     beside it while it lasts;
   - while nobody is playing, a faint ring now and then BLIPS on one marker, the only invitation.
   A trail that loses every marker re-forms at the top with new ones when it next wraps. */
function damarosTrails(canvas, host, opts) {
  var MARKERS = ['CEA', 'CA-125', 'CA 19-9', 'CA 15-3', 'CA 27.29', 'CA 72-4', 'PSA', 'PSMA', 'AFP', 'beta-hCG',
    'LDH', 'HE4', 'CYFRA 21-1', 'NSE', 'ProGRP', 'SCC-Ag', 'Calcitonin', 'Thyroglobulin', 'Chromogranin A',
    '5-HIAA', 'B2M', 'M-protein', 'FLC ratio', 'HER2', 'ER', 'PR', 'Ki-67', 'EGFR', 'ALK', 'ROS1', 'KRAS G12C',
    'NRAS', 'BRAF V600E', 'NTRK', 'RET', 'MET ex14', 'PD-L1', 'MSI-H', 'dMMR', 'TMB', 'HRD', 'BRCA1', 'BRCA2',
    'PIK3CA', 'ESR1', 'AR-V7', 'FGFR2', 'IDH1', 'FLT3', 'NPM1', 'BCR-ABL', 'KIT', 'PDGFRA', 'CD20', 'CD19',
    'ctDNA', 'EBV DNA', 'HPV16'];
  var reduce = opts.reduce;
  var ctx = canvas.getContext('2d');
  var FONT = '400 11px "IBM Plex Mono", ui-monospace, Menlo, monospace';
  var INK = [47, 97, 147], INK_DEEP = [33, 77, 121], MUTED = [101, 116, 130];
  var LINE = 17, LANE = 120, RADIUS = 46, LOCK = 1.9, CHAIN = 0.7;
  var TAIL = [1, 0.58, 0.33, 0.17];
  var w = 0, h = 0, dpr = 1, trails = [], bits = [], rings = [], keep = null;
  var px = -1e4, py = -1e4, touch = false, last = 0, raf = 0, running = false, clock = 0;
  var ppx = -1e4, ppy = -1e4, nS = 1, sx = new Array(26), sy = new Array(26), lastLX = 0, lastLY = 0, widths = {}, cw = 6.6, topoEl = host.querySelector('.topo-wrap'), rect = { left: 0, top: 0 }, slow = 0, shrunk = false;
  var sprites = {}, heatC = null;
  var leanX = 0, leanY = 0, score = 0, chain = 0, lastKill = -9, pulse = 0, idleSince = 0, nextBlip = 2.5;

  function pick(n) {
    var out = [];
    while (out.length < n) { var m = MARKERS[(Math.random() * MARKERS.length) | 0]; if (out.indexOf(m) < 0) out.push(m); }
    return out;
  }
  /* THE PROCESSION. Six trails - share one
     speed and one loop, each at its own fixed phase, so four or five are always readable on screen and
     never two at the same height. Each time a trail wraps it takes fresh markers and a fresh column: never its
     neighbours' columns, and never the column the pointer is resting in, so nothing is born into the probe. */
  function relabel(t) {
    var n = 3 + (Math.random() < 0.5 ? 1 : 0);
    t.labels = pick(n).map(function (s) { return { s: s, alive: true }; });
    t.depth = 0.6 + Math.random() * 0.4;
  }
  function laneX(l) { return pad + l * lw + 6; }
  function underPointer(l) {
    if (px < -1e3) return false;
    var x0 = laneX(l) - RADIUS * LOCK, x1 = laneX(l) + 100 + RADIUS * LOCK;
    return px > x0 && px < x1;
  }
  /* Columns that pass through the mark and name would spend their best moments faded out, so they are
     skipped and every trail on screen is one you can read. Measured against the block itself, not its
     padded clear zone, so a phone keeps both side columns. */
  function throughName(l) {
    var c = core || (keep && keep[0]);
    if (!c) return false;
    var x0 = laneX(l), x1 = x0 + 100;
    return x1 > c.l + 28 && x0 < c.r - 28;
  }
  function placeLane(t, i) {
    var near = [trails[(i + trails.length - 1) % trails.length], trails[(i + 1) % trails.length]];
    var avoid = near.map(function (o) { return o && o !== t ? o.lane : -1; });
    var best = [], ok = [];
    for (var l = 0; l < lanes; l++) {
      if (underPointer(l) || throughName(l)) continue;
      ok.push(l);
      if (avoid.indexOf(l) < 0 && l !== t.lane) best.push(l);

    t.lane = pool[(Math.random() * pool.length) | 0];

  var lanes = 3, lw = LANE, pad = 0, loop = 1, SPEED = 30, MARGIN = 90;

    loop = h + 4 * LINE + MARGIN;

    for (var i = 0; i < count; i++) trails.push({ phase: i * gap + (Math.random() - 0.5) * gap * 0.4, lane: -1, lastY: null });
    measureKeep();
    for (var k = 0; k < count; k++) { placeLane(trails[k], k); relabel(trails[k]); }
  }
  /* Clear zones: the trails fade out around the name and around the email, never crossing either. */
  /* THE SUMMIT UNDER THE NAME. The map is sized and placed so its summit lands on the centre of the
     mark-and-name block, whatever the screen's shape: the smallest scale that still covers the oversized
     layer from that anchor, then the drift turns about the same point. The summit is where the rings
     actually centre, measured by the generator and written on the svg as data-summit, not the nominal
     peak. Layout boxes only, so the float and the drift never feed back into the measurement. */
  function placeTopo() {
    var topoSvg = topoEl && topoEl.querySelector('svg');
    var anchor = opts.anchor && opts.anchor();
    if (!topoEl || !topoSvg || !anchor) return;
    var vb = topoSvg.viewBox && topoSvg.viewBox.baseVal;
    var sm = (topoSvg.getAttribute('data-summit') || '').split(' ').map(Number);
    if (!vb || !vb.width || sm.length !== 2 || isNaN(sm[0]) || isNaN(sm[1])) return;
    var cx = sm[0] - vb.x, cy = sm[1] - vb.y;
    var hb = host.getBoundingClientRect(), ab = anchor.getBoundingClientRect();
    var W = topoEl.offsetWidth, H = topoEl.offsetHeight;
    if (!W || !H) return;
    var ax = ab.left + ab.width / 2 - hb.left - topoEl.offsetLeft;
    var ay = ab.top + ab.height / 2 - hb.top - topoEl.offsetTop;
    var s = Math.max(ax / cx, (W - ax) / (vb.width - cx), ay / cy, (H - ay) / (vb.height - cy));
    topoSvg.style.inset = 'auto';
    topoSvg.style.left = (ax - cx * s).toFixed(2) + 'px';
    topoSvg.style.top = (ay - cy * s).toFixed(2) + 'px';
    topoSvg.style.width = (vb.width * s).toFixed(2) + 'px';
    topoSvg.style.height = (vb.height * s).toFixed(2) + 'px';
    topoEl.style.transformOrigin = ax.toFixed(1) + 'px ' + ay.toFixed(1) + 'px';
  }
  var core = null;
  function measureKeep() {
    placeTopo();
    var els = (opts.keep && opts.keep()) || [], b = host.getBoundingClientRect();
    var ce = opts.core && opts.core();

      var a = el.getBoundingClientRect();

    });
  }
  function keepFade(x, y, tw) {
    var f = 1;
    for (var i = 0; keep && i < keep.length; i++) {
      var k = keep[i], dx = Math.max(k.l - (x + tw), 0, x - k.r), dy = Math.max(k.t - y, 0, y - LINE - k.b);
      f = Math.min(f, Math.hypot(dx, dy) / 70);

  function textW(s) {
    var v = widths[s];
    if (v === undefined) v = widths[s] = ctx.measureText(s).width;

  function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + Math.max(0, a).toFixed(3) + ')'; }

  function ablate(t, j, ly) {
    var lab = t.labels[j]; lab.alive = false;
    var cx = t.x, base = t.depth * TAIL[j];
    chain = clock - lastKill < CHAIN ? chain + 1 : 1; lastKill = clock; score++; pulse = 1;
    var room = Math.max(0, 420 - bits.length);
    for (var i = 0; i < lab.s.length && i < room; i++) {
      var ch = lab.s[i]; if (ch === ' ') continue;
      var x = cx + i * cw + cw / 2, y = ly - 4;
      var ang = Math.atan2(y - py, x - px) + (Math.random() - 0.5) * 0.9, sp = 70 + Math.random() * 150;
      bits.push({ ch: ch, x: x, y: y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 20, r: 0, vr: (Math.random() - 0.5) * 9, life: 0, max: 0.55 + Math.random() * 0.35, a: Math.max(0.45, base) });
    }
    var mx = cx + lab.s.length * cw / 2;
    for (var k = 0; k < 6 + chain * 2 && bits.length < 480; k++) {
      var a2 = Math.random() * Math.PI * 2, s2 = 90 + Math.random() * 180;
      bits.push({ dot: true, x: mx, y: ly - 4, vx: Math.cos(a2) * s2, vy: Math.sin(a2) * s2, life: 0, max: 0.35 + Math.random() * 0.3, a: 0.7 });
    }
    rings.push({ x: mx, y: ly - 4, life: 0, max: 0.42, size: 20 * (1 + 0.3 * Math.min(chain - 1, 4)), a: 0.42 });
  }

  /* Pre-rendered pieces. Text drawn under a rotation or scale is re-rasterised on every call, so the
     scattered letters and the probe's warmth are drawn once to small canvases and stamped with drawImage.
     Colours are fixed strings and opacity goes through globalAlpha, so a frame allocates nothing. */
  var INK_S = 'rgb(47,97,147)', DEEP_S = 'rgb(33,77,121)', MUTED_S = 'rgb(101,116,130)';
  var headX = new Float32Array(64), headY = new Float32Array(64), nH = 0;
  var opx = -1e4, opy = -1e4, pvx = 0, pvy = 0, hovering = false;
  function glyph(ch, deep) {
    var key = (deep ? 'd' : 'i') + ch, s = sprites[key];
    if (s) return s;
    var c = document.createElement('canvas'), gw = cw + 6, gh = 18;
    c.width = Math.ceil(gw * dpr); c.height = Math.ceil(gh * dpr);
